<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 虛擬數位展覽館 | 藝廊體驗</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif;
      background-color: #c8bcae;
      user-select: none;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* 頂部與底部 UI 層級，確保在 Canvas 之上 */
    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }

    .pointer-auto {
      pointer-events: auto;
    }

    /* 導覽 HUD 動畫與質感 */
    .glass-hud {
      background: rgba(28, 25, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .station-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .station-btn.active {
      background: #f59e0b;
      color: #18181b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="text-stone-100">

  <!-- 3D WebGL Canvas 畫布 -->
  <canvas id="webgl-canvas"></canvas>

  <!-- 載入中動畫遮罩 -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-900 transition-opacity duration-700">
    <div class="w-16 h-16 border-4 border-amber-500/30 border-t-amber-500 rounded-full animate-spin mb-4"></div>
    <h2 class="text-xl font-medium tracking-widest text-amber-400">進入 3D 展覽館空間...</h2>
    <p class="text-stone-400 text-sm mt-2">加載 3D 展廳與藝術品</p>
  </div>

  <!-- 頂部標題 Header -->
  <header class="ui-layer fixed top-4 left-4 right-4 flex items-center justify-between">
    <div class="pointer-auto flex items-center gap-2 md:gap-3 bg-stone-900/80 backdrop-blur-md border border-stone-700 px-3 py-2 md:px-5 md:py-3 rounded-2xl shadow-xl max-w-[65%] sm:max-w-none">
      <div class="w-2.5 h-2.5 rounded-full bg-cyan-300 animate-pulse shrink-0"></div>
      <h1 class="text-xs sm:text-base md:text-xl font-bold tracking-wider text-stone-100 truncate">數位展覽館 <span class="hidden sm:inline text-xs text-cyan-300 font-normal ml-2">5 主題 • 鑽石核心</span></h1>
    </div>

    <!-- 右上角功能控制 -->
    <div class="pointer-auto flex items-center gap-2">
      <!-- 燈光模式切換按鈕 -->
      <button id="toggle-light-btn" class="bg-stone-900/80 hover:bg-stone-800 text-stone-200 border border-stone-700 p-2.5 sm:px-4 sm:py-2.5 rounded-xl text-xs md:text-sm font-medium shadow-xl transition flex items-center gap-2" title="切換情調燈光">
        <i class="fa-solid fa-lightbulb text-amber-400"></i>
        <span class="hidden sm:inline">情調模式</span>
      </button>

      <!-- 音效切換按鈕 -->
      <button id="toggle-audio-btn" class="bg-stone-900/80 hover:bg-stone-800 text-stone-200 border border-stone-700 p-2.5 sm:px-4 sm:py-2.5 rounded-xl text-xs md:text-sm font-medium shadow-xl transition flex items-center gap-2" title="背景情調音樂">
        <i class="fa-solid fa-volume-xmark text-stone-400" id="audio-icon"></i>
        <span class="hidden sm:inline" id="audio-text">背景音: 關</span>
      </button>
    </div>
  </header>

  <!-- 底部 HUD 導覽系統 -->
  <div class="ui-layer fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-4xl">
    <nav class="glass-hud p-2 rounded-2xl flex items-center justify-between gap-1 md:gap-2 shadow-2xl pointer-auto">
      <button data-station="0" class="station-btn active flex-1 py-2.5 px-3 md:px-4 rounded-xl text-xs md:text-sm font-medium text-stone-300 hover:text-white hover:bg-stone-800/60 flex flex-col md:flex-row items-center justify-center gap-1.5">
        <i class="fa-solid fa-mountain"></i>
        <span>群山</span>
      </button>

      <button data-station="1" class="station-btn flex-1 py-2.5 px-3 md:px-4 rounded-xl text-xs md:text-sm font-medium text-stone-300 hover:text-white hover:bg-stone-800/60 flex flex-col md:flex-row items-center justify-center gap-1.5">
        <i class="fa-solid fa-sun"></i>
        <span>夕陽</span>
      </button>

      <button data-station="2" class="station-btn flex-1 py-2.5 px-3 md:px-4 rounded-xl text-xs md:text-sm font-medium text-stone-300 hover:text-white hover:bg-stone-800/60 flex flex-col md:flex-row items-center justify-center gap-1.5">
        <i class="fa-solid fa-landmark"></i>
        <span>人文</span>
      </button>

      <button data-station="3" class="station-btn flex-1 py-2.5 px-3 md:px-4 rounded-xl text-xs md:text-sm font-medium text-stone-300 hover:text-white hover:bg-stone-800/60 flex flex-col md:flex-row items-center justify-center gap-1.5">
        <i class="fa-solid fa-tree"></i>
        <span>森林</span>
      </button>

      <button data-station="4" class="station-btn flex-1 py-2.5 px-3 md:px-4 rounded-xl text-xs md:text-sm font-medium text-stone-300 hover:text-white hover:bg-stone-800/60 flex flex-col md:flex-row items-center justify-center gap-1.5">
        <i class="fa-solid fa-water"></i>
        <span>飛瀑</span>
      </button>

      <div class="h-6 w-[1px] bg-stone-700 mx-1 hidden md:block"></div>

      <button id="reset-cam-btn" class="p-2.5 px-3 rounded-xl text-xs md:text-sm text-stone-400 hover:text-amber-400 hover:bg-stone-800/80 transition-colors pointer-auto" title="對焦展區">
        <i class="fa-solid fa-crosshairs text-base"></i>
      </button>
    </nav>
  </div>

  <!-- 展品詳細資訊視窗 Modal -->
  <div id="artwork-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-card" class="bg-stone-900 border border-stone-700 w-full max-w-3xl rounded-3xl overflow-hidden shadow-2xl transition-transform duration-300 scale-95 flex flex-col md:flex-row">
      
      <!-- 相片大圖區 -->
      <div class="w-full md:w-3/5 bg-stone-950 flex items-center justify-center p-4 min-h-[260px]">
        <img id="modal-img" src="" alt="Artwork Detail" class="max-h-[60vh] object-contain rounded-lg border border-stone-800 shadow-xl">
      </div>

      <!-- 作品資訊區 -->
      <div class="w-full md:w-2/5 p-6 flex flex-col justify-between border-t md:border-t-0 md:border-l border-stone-800 bg-stone-900/90">
        <div>
          <div class="flex items-center justify-between mb-4">
            <span id="modal-theme" class="text-xs font-semibold uppercase tracking-wider text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-md">主題區</span>
            <button id="close-modal-btn" class="w-8 h-8 flex items-center justify-center rounded-full bg-stone-800 text-stone-400 hover:text-white hover:bg-stone-700 transition-colors">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <h3 id="modal-title" class="text-2xl font-bold text-stone-100 mb-3 font-serif">作品名稱</h3>
          <p id="modal-desc" class="text-sm text-stone-300 leading-relaxed font-light">作品詳細介紹說明...</p>
        </div>

        <div class="mt-6 pt-4 border-t border-stone-800 flex items-center justify-between text-xs text-stone-400">
          <span>展位: 啞光黑畫框作品</span>
          <span class="text-amber-400/80"><i class="fa-solid fa-circle-info mr-1"></i> 3D 展廳現場展出</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 全域 3D 與控制變數
    let scene, camera, renderer;
    let targetCameraPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    let currentLookAt = new THREE.Vector3();
    let interactiveObjects = [];
    let currentStationIndex = 0;

    // 滑鼠旋轉與縮放鏡頭變數
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraAngle = 0; // 繞 Y 軸旋轉角度
    let cameraHeight = 2.2;
    let cameraDistance = 8.5;

    const galleryRadius = 14;
    const stationAngles = [0, 1.256, 2.513, 3.769, 5.026];

    // 5 個展區數據
    const galleryData = [
      {
        theme: "Mountains",
        themeTitle: "🏔️ 群山峻嶺",
        spotColor: 0xffeedd,
        artworks: [
          { title: "雪峰暮色", desc: "暮色籠罩下的連綿雪峰，展現出大自然的寧靜與宏偉壯麗。", url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80" },
          { title: "金輝晨山", desc: "晨光映照在巍峨山嶺之上，金黃色的光芒灑落於險峻山脊。", url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" }
        ]
      },
      {
        theme: "Sunsets",
        themeTitle: "🌅 旭日夕陽",
        spotColor: 0xffeedd,
        artworks: [
          { title: "海岸落日", desc: "波光粼粼的海岸線，夕陽將天空染成極致浪漫的橙紅色澤。", url: "https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?auto=format&fit=crop&w=1000&q=80" },
          { title: "晚霞餘暉", desc: "天際漸層的紫紅晚霞，記錄下日光隱入地平線前最輝煌的時刻。", url: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1000&q=80" }
        ]
      },
      {
        theme: "Culture",
        themeTitle: "🏮 人文風情",
        spotColor: 0xffeedd,
        artworks: [
          { title: "古城燈火", desc: "沉澱歲月痕跡的歷史街巷與溫暖燈火，訴說著濃烈的人文記憶。", url: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1000&q=80" },
          { title: "匠人工藝", desc: "傳統工藝者的專注眼神，每一道痕跡都是歲月與文化傳承的結晶。", url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1000&q=80" }
        ]
      },
      {
        theme: "Forests",
        themeTitle: "🌲 茂密森林",
        spotColor: 0xffeedd,
        artworks: [
          { title: "綠意林徑", desc: "陽光穿透高聳樹冠灑落斑駁光影，充滿盎然生機與幽靜芬多精。", url: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=80" },
          { title: "晨霧秘林", desc: "輕霧瀰漫於深林小徑間，神秘而寧靜的氛圍令人宛如置身仙境。", url: "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1000&q=80" }
        ]
      },
      {
        theme: "Cascades",
        themeTitle: "🌊 飛瀑流泉",
        spotColor: 0xffeedd,
        artworks: [
          { title: "山谷飛瀑", desc: "萬丈水瀑奔騰而下，激起層層水霧，磅礴的自然動能撼動人心。", url: "https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=1000&q=80" },
          { title: "碧潭流泉", desc: "清澈見底的山泉匯聚成翡翠般的碧綠水潭，波光瀲灩純淨無暇。", url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1000&q=80" }
        ]
      }
    ];

    // 初始化 Three.js 展館場景
    function initScene() {
      const container = document.getElementById('webgl-canvas');
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xc8bcae);
      scene.fog = new THREE.FogExp2(0xc8bcae, 0.028);

      // 2. Camera (手機版進一步拉遠鏡頭與開大視野)
      const initialFov = isMobile ? (aspect < 0.6 ? 90 : 80) : 55;
      camera = new THREE.PerspectiveCamera(initialFov, aspect, 0.1, 100);
      const initDist = isMobile ? (aspect < 0.6 ? galleryRadius - 0.2 : galleryRadius - 1.2) : 8.5;
      camera.position.set(0, 2.2, initDist);
      currentLookAt.set(0, 2.2, 14);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      // 4. 搭建建築與中心鑽石
      buildArchitecture();

      // 5. 搭建 5 大主題展區
      buildStations();

      // 6. 設定事件與互動
      setupInteraction();

      // 預設第 0 個 Station
      goToStation(0);

      // 關閉載入畫面
      setTimeout(() => {
        const loader = document.getElementById('loading-overlay');
        if (loader) {
          loader.classList.add('opacity-0');
          setTimeout(() => loader.remove(), 700);
        }
      }, 600);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // 建立藝廊建築主體
    function buildArchitecture() {
      // 圓形地板
      const floorGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xb5a798,
        roughness: 0.45,
        metalness: 0.15
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      scene.add(floor);

      // 天花板
      const ceilingGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const ceilingMat = new THREE.MeshStandardMaterial({
        color: 0x9b8b7c,
        roughness: 0.9
      });
      const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
      ceiling.position.y = 5.8;
      scene.add(ceiling);

      // 柔和天光
      const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
      ambientLight.name = "ambientLight";
      scene.add(ambientLight);

      // 中央高空主聚光燈
      const centerLight = new THREE.PointLight(0xffffff, 2.5, 16);
      centerLight.position.set(0, 4.8, 0);
      centerLight.name = "centerLight";
      scene.add(centerLight);

      // 中央寶石基座
      const baseGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.8, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x27272a,
        roughness: 0.3,
        metalness: 0.85
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.set(0, 0.4, 0);
      base.castShadow = true;
      base.receiveShadow = true;
      scene.add(base);

      // 中央透明鑽石
      const crystalGeo = new THREE.IcosahedronGeometry(0.85, 0);
      const crystalMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        roughness: 0.05,
        metalness: 0.05,
        transmission: 0.92,
        ior: 2.417,
        transparent: true,
        opacity: 0.95,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.set(0, 1.6, 0);
      crystal.castShadow = true;
      crystal.name = "centerCrystal";
      scene.add(crystal);
    }

    // 建立 5 個展區
    function buildStations() {
      const textureLoader = new THREE.TextureLoader();

      galleryData.forEach((data, index) => {
        const angle = stationAngles[index];
        const stationGroup = new THREE.Group();

        // 主牆
        const wallWidth = 7.5;
        const wallHeight = 5.2;
        const mainWallGeo = new THREE.BoxGeometry(wallWidth, wallHeight, 0.3);
        const mainWallMat = new THREE.MeshStandardMaterial({
          color: 0xbfaea0,
          roughness: 0.8
        });
        const mainWall = new THREE.Mesh(mainWallGeo, mainWallMat);
        mainWall.position.set(0, wallHeight / 2, 0);
        mainWall.receiveShadow = true;
        mainWall.castShadow = true;
        stationGroup.add(mainWall);

        // 側牆
        const sideWallWidth = 2.4;
        const sideWallGeo = new THREE.BoxGeometry(sideWallWidth, wallHeight, 0.25);
        const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xa19080, roughness: 0.85 });

        const leftSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        leftSideWall.position.set(-wallWidth / 2 - 0.7, wallHeight / 2, 0.7);
        leftSideWall.rotation.y = Math.PI / 6;
        stationGroup.add(leftSideWall);

        const rightSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        rightSideWall.position.set(wallWidth / 2 + 0.7, wallHeight / 2, 0.7);
        rightSideWall.rotation.y = -Math.PI / 6;
        stationGroup.add(rightSideWall);

        // 聚光燈
        const spotLight = new THREE.SpotLight(data.spotColor, 2.5);
        spotLight.position.set(0, 6, 2.8);
        spotLight.target = mainWall;
        spotLight.angle = Math.PI / 3.2;
        spotLight.penumbra = 0.45;
        spotLight.castShadow = true;
        stationGroup.add(spotLight);

        // 標題版
        const titleCanvas = document.createElement('canvas');
        titleCanvas.width = 512;
        titleCanvas.height = 128;
        const ctx = titleCanvas.getContext('2d');
        ctx.fillStyle = "#bfaea0";
        ctx.fillRect(0, 0, 512, 128);
        ctx.fillStyle = "#18181b";
        ctx.font = "Bold 38px 'Noto Serif TC', serif";
        ctx.textAlign = "center";
        ctx.fillText(data.themeTitle, 256, 75);

        const titleTex = new THREE.CanvasTexture(titleCanvas);
        const titleGeo = new THREE.PlaneGeometry(2.2, 0.55);
        const titleMat = new THREE.MeshBasicMaterial({ map: titleTex, transparent: true });
        // 5. 放 2 張相片與啞光黑色畫框 (根據 Mobile 自動調整間距與尺寸)
        const aspect = window.innerWidth / window.innerHeight;
        const isMobile = aspect < 1.0 || window.innerWidth < 768;
        
        // 手機版收窄兩框之間的距離 (X 座標由 -1.9/1.9 縮至 -1.0/1.0)
        const frameXPositions = isMobile ? [-1.0, 1.0] : [-1.9, 1.9];

        data.artworks.forEach((art, artIdx) => {
          // 手機版畫框適度縮小寬度
          const frameWidth = isMobile ? 1.65 : 2.4;
          const frameHeight = isMobile ? 1.25 : 1.7;

          const artworkGroup = new THREE.Group();
          artworkGroup.position.set(frameXPositions[artIdx], 2.4, 0.16);

          // 啞光黑色畫框
          const frameBorderGeo = new THREE.BoxGeometry(frameWidth + (isMobile ? 0.1 : 0.16), frameHeight + (isMobile ? 0.1 : 0.16), 0.08);
          const frameBorderMat = new THREE.MeshStandardMaterial({
            color: 0x111113,
            roughness: 0.35,
            metalness: 0.2
          });
          const frameBorder = new THREE.Mesh(frameBorderGeo, frameBorderMat);
          artworkGroup.add(frameBorder);

          // 畫框內襯墊 (Passepartout - 米色 #eadecc)
          const matBoardGeo = new THREE.PlaneGeometry(frameWidth + 0.02, frameHeight + 0.02);
          const matBoardMat = new THREE.MeshBasicMaterial({ color: 0xeadecc });
          const matBoard = new THREE.Mesh(matBoardGeo, matBoardMat);
          matBoard.position.z = 0.042;
          artworkGroup.add(matBoard);

          // 圖片 Mesh
          const pictureGeo = new THREE.PlaneGeometry(frameWidth - (isMobile ? 0.12 : 0.2), frameHeight - (isMobile ? 0.12 : 0.2));
          const texture = textureLoader.load(art.url);
          texture.encoding = THREE.sRGBEncoding;

          const pictureMat = new THREE.MeshBasicMaterial({ map: texture });
          const pictureMesh = new THREE.Mesh(pictureGeo, pictureMat);
          pictureMesh.position.z = 0.045;
          artworkGroup.add(pictureMesh);

          // 標記互動資料
          pictureMesh.userData = {
            stationId: index,
            artId: artIdx,
            title: art.title,
            desc: art.desc,
            theme: data.theme,
            url: art.url
          };
          interactiveObjects.push(pictureMesh);

          // 銘牌 (底色與主牆色一致)
          const plaqueCanvas = document.createElement('canvas');
          plaqueCanvas.width = 256;
          plaqueCanvas.height = 64;
          const pCtx = plaqueCanvas.getContext('2d');
          pCtx.fillStyle = "#bfaea0";
          pCtx.fillRect(0, 0, 256, 64);
          pCtx.fillStyle = "#18181b";
          pCtx.font = "Bold 20px sans-serif";
          pCtx.textAlign = "center";
          pCtx.fillText(art.title.substring(0, 10), 128, 40);

          const plaqueTex = new THREE.CanvasTexture(plaqueCanvas);
          const plaqueGeo = new THREE.PlaneGeometry(isMobile ? 0.8 : 1.2, isMobile ? 0.22 : 0.3);
          const plaqueMat = new THREE.MeshBasicMaterial({ map: plaqueTex });
          const plaqueMesh = new THREE.Mesh(plaqueGeo, plaqueMat);
          plaqueMesh.position.set(0, isMobile ? -0.85 : -1.15, 0.042);
          artworkGroup.add(plaqueMesh);

          stationGroup.add(artworkGroup);
        });

        stationGroup.position.x = Math.sin(angle) * galleryRadius;
        stationGroup.position.z = Math.cos(angle) * galleryRadius;
        stationGroup.rotation.y = angle + Math.PI;

        scene.add(stationGroup);
      });
    }

    // 移動視角至指定 Station
    function goToStation(index) {
      currentStationIndex = index;

      document.querySelectorAll('.station-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      const angle = stationAngles[index];
      cameraAngle = angle;

      // 移動端適配視角與距離
      cameraDistance = isMobile ? galleryRadius - 2.8 : galleryRadius - 5.5;
      cameraHeight = isMobile ? 2.15 : 2.2;

      updateCameraTarget();
    }

    function updateCameraTarget() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      targetCameraPos.x = Math.sin(cameraAngle) * cameraDistance;
      targetCameraPos.z = Math.cos(cameraAngle) * cameraDistance;
      targetCameraPos.y = cameraHeight;

      targetLookAt.x = Math.sin(cameraAngle) * galleryRadius;
      targetLookAt.z = Math.cos(cameraAngle) * galleryRadius;
      targetLookAt.y = isMobile ? 2.35 : 2.6;
    }

    // 移動視角至指定 Station
    function goToStation(index) {
      currentStationIndex = index;

      document.querySelectorAll('.station-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      const angle = stationAngles[index];
      cameraAngle = angle;

      // 修正鏡頭位置：維持在牆面前方（`galleryRadius - 4.5` 到 `5.5`），絕不退至牆後！
      cameraDistance = isMobile ? galleryRadius - 4.2 : galleryRadius - 5.5;
      cameraHeight = isMobile ? 2.3 : 2.2;

      updateCameraTarget();
    }

    function updateCameraTarget() {
      targetCameraPos.x = Math.sin(cameraAngle) * cameraDistance;
      targetCameraPos.z = Math.cos(cameraAngle) * cameraDistance;
      targetCameraPos.y = cameraHeight;

      targetLookAt.x = Math.sin(cameraAngle) * galleryRadius;
      targetLookAt.z = Math.cos(cameraAngle) * galleryRadius;
      targetLookAt.y = 2.6;
    }

    // 設定互動與右上角控制功能
    function setupInteraction() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // 導覽按鈕
      document.querySelectorAll('.station-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-station'));
          goToStation(idx);
        });
      });

      document.getElementById('reset-cam-btn').addEventListener('click', () => {
        goToStation(currentStationIndex);
      });

      // 滑鼠拖拽旋轉視角
      const canvas = document.getElementById('webgl-canvas');
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        cameraAngle -= deltaX * 0.005;
        cameraHeight = Math.max(0.5, Math.min(4.5, cameraHeight + deltaY * 0.005));

        updateCameraTarget();
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // 滑鼠滾輪後拉縮放 (Zoom)
      window.addEventListener('wheel', (e) => {
        cameraDistance = Math.max(3.0, Math.min(16.0, cameraDistance + e.deltaY * 0.005));
        updateCameraTarget();
      }, { passive: true });

      // 點擊展品互動
      window.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('#artwork-modal')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveObjects);

        if (intersects.length > 0) {
          const artData = intersects[0].object.userData;
          openModal(artData);
        }
      });

      // 燈光模式切換
      let isMoodMode = true;
      document.getElementById('toggle-light-btn').addEventListener('click', () => {
        isMoodMode = !isMoodMode;
        const amb = scene.getObjectByName("ambientLight");
        const centerL = scene.getObjectByName("centerLight");
        const btn = document.getElementById('toggle-light-btn');

        if (isMoodMode) {
          amb.intensity = 0.75;
          centerL.intensity = 2.5;
          renderer.toneMappingExposure = 1.15;
          btn.innerHTML = `<i class="fa-solid fa-lightbulb text-amber-400"></i><span class="hidden sm:inline">情調模式</span>`;
        } else {
          amb.intensity = 1.3;
          centerL.intensity = 4.5;
          renderer.toneMappingExposure = 1.35;
          btn.innerHTML = `<i class="fa-solid fa-sun text-yellow-300"></i><span class="hidden sm:inline">高亮模式</span>`;
        }
      });

      // 簡易背景合音音效 (Web Audio API 類合成音)
      let audioCtx = null;
      let osc1 = null, osc2 = null, gainNode = null;
      let isAudioPlaying = false;

      document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        const icon = document.getElementById('audio-icon');
        const text = document.getElementById('audio-text');

        if (!isAudioPlaying) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc1 = audioCtx.createOscillator();
            osc2 = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime); // D3
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(220.00, audioCtx.currentTime); // A3

            gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();

            isAudioPlaying = true;
            icon.className = "fa-solid fa-volume-high text-amber-400 animate-pulse";
            text.innerText = "背景音: 開";
          } catch(e) {
            console.log(e);
          }
        } else {
          if (osc1) osc1.stop();
          if (osc2) osc2.stop();
          if (audioCtx) audioCtx.close();
          isAudioPlaying = false;
          icon.className = "fa-solid fa-volume-xmark text-stone-400";
          text.innerText = "背景音: 關";
        }
      });

      // Modal 關閉
      document.getElementById('close-modal-btn').addEventListener('click', closeModal);
      document.getElementById('artwork-modal').addEventListener('click', (e) => {
        if (e.target.id === 'artwork-modal') closeModal();
      });
    }

    function openModal(data) {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');

      document.getElementById('modal-img').src = data.url;
      document.getElementById('modal-theme').innerHTML = `<i class="fa-solid fa-layer-group"></i> ${data.theme}`;
      document.getElementById('modal-title').innerText = data.title;
      document.getElementById('modal-desc').innerText = data.desc;

      modal.classList.remove('pointer-events-none');
      modal.classList.remove('opacity-0');
      modalCard.classList.remove('scale-95');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');

      modal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('pointer-events-none');
      }, 300);
    }

    function onWindowResize() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      // 依長寬比精準匹配視野
      camera.fov = isMobile ? 85 : 55;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      if (currentStationIndex !== undefined) {
        goToStation(currentStationIndex);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      camera.position.lerp(targetCameraPos, 0.06);
      currentLookAt.lerp(targetLookAt, 0.06);
      camera.lookAt(currentLookAt);

      // 中央透明鑽石自轉與浮動
      const centerCrystal = scene.getObjectByName("centerCrystal");
      if (centerCrystal) {
        centerCrystal.rotation.y += 0.008;
        centerCrystal.rotation.x += 0.003;
        centerCrystal.position.y = 1.6 + Math.sin(Date.now() * 0.0015) * 0.12;
      }

      renderer.render(scene, camera);
    }

    window.onload = function () {
      initScene();
    };
  </script>
</body>
</html>
