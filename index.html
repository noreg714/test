      touch-action: none;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    /* 頂部與底部 UI 層級，確保在 Canvas 之上 */
    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }

    .pointer-auto {
      pointer-events: auto;
    }

    /* 導覽 HUD 動畫與質感 */
    .glass-hud {
      background: rgba(28, 25, 23, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .station-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .station-btn.active {
      background: #f59e0b;
      color: #18181b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {

          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Forests-27.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Forests-38.avif" }
        ]
      },
      {
        theme: "Cascades",
        spotColor: 0xffeedd,
        artworks: [
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Cascades-2.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Cascades-41.avif" }
        ]
      }
    ];

    let titleMeshes = [];
    let plaqueMeshes = [];

    // 滑鼠旋轉與縮放鏡頭變數
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraAngle = 0; // 繞 Y 軸旋轉角度
    let cameraHeight = 2.2;
    let cameraDistance = 8.5;

    const galleryRadius = 14;
    const stationAngles = [0, 1.256, 2.513, 3.769, 5.026];

    // 初始化 Three.js 展館場景
    function initScene() {
      const container = document.getElementById('webgl-canvas');
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xc8bcae);
      scene.fog = new THREE.FogExp2(0xc8bcae, 0.028);

      // 2. Camera (手機直向視角適配 88 度大視野)
      const initialFov = isMobile ? 88 : 55;
      camera = new THREE.PerspectiveCamera(initialFov, aspect, 0.1, 100);
      const initDist = isMobile ? galleryRadius - 2.8 : 8.5;
      camera.position.set(0, 2.2, initDist);
      currentLookAt.set(0, 2.2, 14);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      // 4. 搭建建築與中心鑽石
      buildArchitecture();

      // 5. 搭建 5 大主題展區
      buildStations();

      // 6. 設定事件與互動
      setupInteraction();

      // 預設第 0 個 Station
      goToStation(0);

      // 關閉載入畫面
      setTimeout(() => {
        const loader = document.getElementById('loading-overlay');
        if (loader) {
          loader.classList.add('opacity-0');
          setTimeout(() => loader.remove(), 700);
        }
      }, 600);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // 建立藝廊建築主體
    function buildArchitecture() {
      // 圓形地板
      const floorGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xb5a798,
        roughness: 0.45,
        metalness: 0.15
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      scene.add(floor);

      // 天花板
      const ceilingGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const ceilingMat = new THREE.MeshStandardMaterial({
        color: 0x9b8b7c,
        roughness: 0.9
      });
      const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
      ceiling.position.y = 5.8;
      scene.add(ceiling);

      // 柔和天光
      const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
      ambientLight.name = "ambientLight";
      scene.add(ambientLight);

      // 中央高空主聚光燈
      const centerLight = new THREE.PointLight(0xffffff, 2.5, 16);
      centerLight.position.set(0, 4.8, 0);
      centerLight.name = "centerLight";
      scene.add(centerLight);

      // 中央寶石基座
      const baseGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.8, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x27272a,
        roughness: 0.3,
        metalness: 0.85
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.set(0, 0.4, 0);
      base.castShadow = true;
      base.receiveShadow = true;
      scene.add(base);

      // 中央透明鑽石
      const crystalGeo = new THREE.IcosahedronGeometry(0.85, 0);
      const crystalMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        roughness: 0.05,
        metalness: 0.05,
        transmission: 0.92,
        ior: 2.417,
        transparent: true,
        opacity: 0.95,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.set(0, 1.6, 0);
      crystal.castShadow = true;
      crystal.name = "centerCrystal";
      scene.add(crystal);
    }

    // 建立 5 個展區
    function buildStations() {
      const textureLoader = new THREE.TextureLoader();

      galleryData.forEach((data, index) => {
        const angle = stationAngles[index];
        const stationGroup = new THREE.Group();
        const langData = i18n[currentLang].gallery[index];

        // 主牆
        const wallWidth = 7.5;
        const wallHeight = 5.2;
        const mainWallGeo = new THREE.BoxGeometry(wallWidth, wallHeight, 0.3);
        const mainWallMat = new THREE.MeshStandardMaterial({
          color: 0xbfaea0,
          roughness: 0.8
        });
        const mainWall = new THREE.Mesh(mainWallGeo, mainWallMat);
        mainWall.position.set(0, wallHeight / 2, 0);
        mainWall.receiveShadow = true;
        mainWall.castShadow = true;
        stationGroup.add(mainWall);

        // 側牆
        const sideWallWidth = 2.4;
        const sideWallGeo = new THREE.BoxGeometry(sideWallWidth, wallHeight, 0.25);
        const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xa19080, roughness: 0.85 });

        const leftSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        leftSideWall.position.set(-wallWidth / 2 - 0.7, wallHeight / 2, 0.7);
        leftSideWall.rotation.y = Math.PI / 6;
        stationGroup.add(leftSideWall);

        const rightSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        rightSideWall.position.set(wallWidth / 2 + 0.7, wallHeight / 2, 0.7);
        rightSideWall.rotation.y = -Math.PI / 6;
        stationGroup.add(rightSideWall);

        // 聚光燈
        const spotLight = new THREE.SpotLight(data.spotColor, 2.5);
        spotLight.position.set(0, 6, 2.8);
        spotLight.target = mainWall;
        spotLight.angle = Math.PI / 3.2;
        spotLight.penumbra = 0.45;
        spotLight.castShadow = true;
        stationGroup.add(spotLight);

        // 展區主題標題版 Mesh
        const titleGeo = new THREE.PlaneGeometry(2.4, 0.55);
        const titleMat = new THREE.MeshBasicMaterial({ transparent: true });
        const titleMesh = new THREE.Mesh(titleGeo, titleMat);
        titleMesh.position.set(0, 4.3, 0.17);
        stationGroup.add(titleMesh);
        titleMeshes[index] = titleMesh;

        // 放 2 張相片與畫框
        const aspect = window.innerWidth / window.innerHeight;
        const isMobile = aspect < 1.0 || window.innerWidth < 768;
        const frameXPositions = isMobile ? [-1.0, 1.0] : [-1.9, 1.9];

        plaqueMeshes[index] = [];

        data.artworks.forEach((art, artIdx) => {
          const frameWidth = isMobile ? 1.65 : 2.4;
          const frameHeight = isMobile ? 1.25 : 1.7;

          const artworkGroup = new THREE.Group();
          artworkGroup.position.set(frameXPositions[artIdx], 2.4, 0.16);

          // 啞光黑色畫框 (完全移除了頂部的 Title 標籤)
          const frameBorderGeo = new THREE.BoxGeometry(frameWidth + (isMobile ? 0.1 : 0.16), frameHeight + (isMobile ? 0.1 : 0.16), 0.08);
          const frameBorderMat = new THREE.MeshStandardMaterial({
            color: 0x111113,
            roughness: 0.35,
            metalness: 0.2
          });
          const frameBorder = new THREE.Mesh(frameBorderGeo, frameBorderMat);
          artworkGroup.add(frameBorder);

          // 畫框內襯墊
          const matBoardGeo = new THREE.PlaneGeometry(frameWidth + 0.02, frameHeight + 0.02);
          const matBoardMat = new THREE.MeshBasicMaterial({ color: 0xeadecc });
          const matBoard = new THREE.Mesh(matBoardGeo, matBoardMat);
          matBoard.position.z = 0.042;
          artworkGroup.add(matBoard);

          // 圖片 Mesh
          const pictureGeo = new THREE.PlaneGeometry(frameWidth - (isMobile ? 0.12 : 0.2), frameHeight - (isMobile ? 0.12 : 0.2));
          const texture = textureLoader.load(art.url);
          texture.encoding = THREE.sRGBEncoding;

          const pictureMat = new THREE.MeshBasicMaterial({ map: texture });
          const pictureMesh = new THREE.Mesh(pictureGeo, pictureMat);
          pictureMesh.position.z = 0.045;
          artworkGroup.add(pictureMesh);

          pictureMesh.userData = {
            stationId: index,
            artId: artIdx,
            theme: data.theme,
            url: art.url
          };
          interactiveObjects.push(pictureMesh);

          // 下方銘牌
          const plaqueGeo = new THREE.PlaneGeometry(isMobile ? 0.9 : 1.3, isMobile ? 0.22 : 0.3);
          const plaqueMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1 });
          const plaqueMesh = new THREE.Mesh(plaqueGeo, plaqueMat);
          plaqueMesh.position.set(0, isMobile ? -0.85 : -1.15, 0.042);
          artworkGroup.add(plaqueMesh);
          plaqueMeshes[index][artIdx] = plaqueMesh;

          stationGroup.add(artworkGroup);
        });

        stationGroup.position.x = Math.sin(angle) * galleryRadius;
        stationGroup.position.z = Math.cos(angle) * galleryRadius;
        stationGroup.rotation.y = angle + Math.PI;

        scene.add(stationGroup);
      });

      // 初始化渲染所有 Canvas 貼圖文字
      updateLanguageUI();
    }

    // 動態更新 3D Canvas 貼圖與 HTML UI 多語言
    function updateLanguageUI() {
      const t = i18n[currentLang];

      // 1. 更新 HUD 與 HTML UI
      document.querySelector('h1').innerHTML = `${t.headerTitle} <span class="hidden sm:inline text-xs text-cyan-300 font-normal ml-2">${t.headerSub}</span>`;
      t.nav.forEach((name, i) => {
        const el = document.getElementById(`nav-${i}`);
        if (el) el.innerText = name;
      });

      // 2. 更新 3D 展區看板與銘牌 Canvas 貼圖
      galleryData.forEach((data, index) => {
        const langData = t.gallery[index];

        // 展區主題看板貼圖
        const titleCanvas = document.createElement('canvas');
        titleCanvas.width = 512;
        titleCanvas.height = 128;
        const ctx = titleCanvas.getContext('2d');
        ctx.fillStyle = "#bfaea0";
        ctx.fillRect(0, 0, 512, 128);
        ctx.fillStyle = "#18181b";
        ctx.font = "Bold 36px 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(langData.themeTitle, 256, 75);

        if (titleMeshes[index]) {
          if (titleMeshes[index].material.map) titleMeshes[index].material.map.dispose();
          titleMeshes[index].material.map = new THREE.CanvasTexture(titleCanvas);
          titleMeshes[index].material.needsUpdate = true;
        }

        // 畫框下方銘牌貼圖 (背景設為透明，去除灰色底盒)
        langData.artworks.forEach((art, artIdx) => {
          const plaqueCanvas = document.createElement('canvas');
          plaqueCanvas.width = 400;
          plaqueCanvas.height = 80;
          const pCtx = plaqueCanvas.getContext('2d');
          
          // 清空 Canvas 背景 (透明)
          pCtx.clearRect(0, 0, 400, 80);
          
          pCtx.fillStyle = "#27272a";
          pCtx.font = "600 24px 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif";
          pCtx.textAlign = "center";
          pCtx.textBaseline = "middle";
          pCtx.fillText(art.title, 200, 40);

          const pm = plaqueMeshes[index][artIdx];
          if (pm) {
            if (pm.material.map) pm.material.map.dispose();
            pm.material.map = new THREE.CanvasTexture(plaqueCanvas);
            pm.material.needsUpdate = true;
          }
        });
      });
    }

    // 移動視角至指定 Station
    function goToStation(index) {
      currentStationIndex = index;

      document.querySelectorAll('.station-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      const angle = stationAngles[index];
      cameraAngle = angle;

      cameraDistance = isMobile ? galleryRadius - 2.8 : galleryRadius - 5.5;
      cameraHeight = isMobile ? 2.15 : 2.2;

      updateCameraTarget();
    }

    function updateCameraTarget() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      targetCameraPos.x = Math.sin(cameraAngle) * cameraDistance;
      targetCameraPos.z = Math.cos(cameraAngle) * cameraDistance;
      targetCameraPos.y = cameraHeight;

      targetLookAt.x = Math.sin(cameraAngle) * galleryRadius;
      targetLookAt.z = Math.cos(cameraAngle) * galleryRadius;
      targetLookAt.y = isMobile ? 2.35 : 2.6;
    }

    // 設定互動與右上角控制功能
    function setupInteraction() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // 導覽按鈕切換 Station
      document.querySelectorAll('.station-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-station'));
          goToStation(idx);
        });
      });

      document.getElementById('reset-cam-btn').addEventListener('click', () => {
        goToStation(currentStationIndex);
      });

      // 語言切換事件
      document.getElementById('language-select').addEventListener('change', (e) => {
        currentLang = e.target.value;
        updateLanguageUI();
      });

      // 燈光模式切換
      let isMoodMode = true;
      document.getElementById('toggle-light-btn').addEventListener('click', () => {
        isMoodMode = !isMoodMode;
        const amb = scene.getObjectByName("ambientLight");
        const centerL = scene.getObjectByName("centerLight");
        const btnText = document.getElementById('light-btn-text');

        if (isMoodMode) {
          amb.intensity = 0.75;
          centerL.intensity = 2.5;
          renderer.toneMappingExposure = 1.15;
          btnText.innerText = i18n[currentLang].lightMood;
        } else {
          amb.intensity = 1.3;
          centerL.intensity = 4.5;
          renderer.toneMappingExposure = 1.35;
          btnText.innerText = i18n[currentLang].lightHighlight;
        }
      });

      // 背景音樂 (播放指定音效 MP3)
      const bgAudio = new Audio('https://noreg714.github.io/test/audio/amb-river-and-birds.mp3');
      bgAudio.loop = true;
      let isAudioPlaying = false;

      document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        const icon = document.getElementById('audio-icon');
        const text = document.getElementById('audio-text');

        if (!isAudioPlaying) {
          bgAudio.play().then(() => {
            isAudioPlaying = true;
            icon.className = "fa-solid fa-volume-high text-amber-400 animate-pulse";
            text.innerText = i18n[currentLang].audioOn;
          }).catch(e => {
            console.log("Audio play error:", e);
          });
        } else {
          bgAudio.pause();
          isAudioPlaying = false;
          icon.className = "fa-solid fa-volume-xmark text-stone-400";
          text.innerText = i18n[currentLang].audioOff;
        }
      });

      // 滑鼠與觸控拖拽旋轉/俯仰視角
      const canvas = document.getElementById('webgl-canvas');
      let touchStartDist = 0;

      // 滑鼠事件
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        cameraAngle -= deltaX * 0.004;
        cameraHeight = Math.max(0.5, Math.min(4.5, cameraHeight + deltaY * 0.004));

        updateCameraTarget();
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // 手機觸控事件 (單指平移，雙指 Pinch Zoom 縮放)
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // 防止瀏覽器原生縮放與滾動

        if (e.touches.length === 1 && isDragging) {
          const deltaX = e.touches[0].clientX - previousMousePosition.x;
          const deltaY = e.touches[0].clientY - previousMousePosition.y;

          cameraAngle -= deltaX * 0.005;
          cameraHeight = Math.max(0.5, Math.min(4.5, cameraHeight + deltaY * 0.005));

          updateCameraTarget();
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const deltaDist = currentDist - touchStartDist;

          cameraDistance = Math.max(3.0, Math.min(16.0, cameraDistance - deltaDist * 0.02));
          updateCameraTarget();

          touchStartDist = currentDist;
        }
      }, { passive: false });

      canvas.addEventListener('touchend', () => {
        isDragging = false;
      });

      // 滑鼠滾輪前後推拉縮放 (Zoom)
      window.addEventListener('wheel', (e) => {
        cameraDistance = Math.max(3.0, Math.min(16.0, cameraDistance + e.deltaY * 0.005));
        updateCameraTarget();
      }, { passive: true });

      // 點擊 3D 畫作開啟 Modal 彈窗
      window.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('#artwork-modal') || e.target.closest('select')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveObjects);

        if (intersects.length > 0) {
          const artData = intersects[0].object.userData;
          openModal(artData);
        }
      });

      // Modal 關閉事件
      document.getElementById('close-modal-btn').addEventListener('click', closeModal);
      document.getElementById('artwork-modal').addEventListener('click', (e) => {
        if (e.target.id === 'artwork-modal') closeModal();
      });
    }

    function openModal(data) {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');
      const langArt = i18n[currentLang].gallery[data.stationId].artworks[data.artId];

      document.getElementById('modal-img').src = data.url;
      document.getElementById('modal-theme').innerHTML = `<i class="fa-solid fa-layer-group"></i> ${i18n[currentLang].modalThemeLabel}`;
      document.getElementById('modal-title').innerText = langArt.title;
      document.getElementById('modal-desc').innerText = langArt.desc;

      modal.classList.remove('pointer-events-none');
      modal.classList.remove('opacity-0');
      modalCard.classList.remove('scale-95');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');

      modal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('pointer-events-none');
      }, 300);
    }

    function onWindowResize() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      
      camera.aspect = aspect;
      camera.fov = isMobile ? 88 : 55;
      camera.updateProjectionMatrix();
      
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      camera.position.lerp(targetCameraPos, 0.06);
      currentLookAt.lerp(targetLookAt, 0.06);
      camera.lookAt(currentLookAt);

      // 中央透明鑽石自轉與浮動
      const centerCrystal = scene.getObjectByName("centerCrystal");
      if (centerCrystal) {
        centerCrystal.rotation.y += 0.008;
        centerCrystal.rotation.x += 0.003;
        centerCrystal.position.y = 1.6 + Math.sin(Date.now() * 0.0015) * 0.12;
      }

      renderer.render(scene, camera);
    }

    window.onload = function () {
      initScene();
    };
  </script>
</body>
</html>
